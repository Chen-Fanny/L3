<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CWA 臺灣即時氣溫廣播視覺化 | Taiwan Temperature Broadcast</title>
  <meta name="description" content="結合中央氣象署 CWA OpenData 與 Windy API / Leaflet 地圖，提供臺灣即時氣溫觀測、風場與氣象圖層視覺化儀表板。">

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet 1.4.0 CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.4.0/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.4.0/dist/leaflet.js"></script>

  <!-- Windy Map Forecast API libBoot.js -->
  <script src="https://api.windy.com/assets/map-forecast/libBoot.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Top Navigation Bar -->
  <header class="top-nav">
    <div class="nav-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>
        </svg>
      </div>
      <div>
        <h1 class="brand-title">CWA 臺灣即時氣溫廣播</h1>
        <span class="brand-subtitle">Taiwan Temperature Broadcast · Windy & Leaflet</span>
      </div>
    </div>

    <!-- Status & Info Badges -->
    <div class="nav-center">
      <div class="status-indicator">
        <span id="status-indicator-dot" class="status-dot dot-online"></span>
        <span id="connection-status-text">即時連線正常</span>
      </div>
      <div class="info-pill">
        <span class="pill-label">最後觀測:</span>
        <span id="cwa-update-time" class="pill-value">讀取中...</span>
      </div>
      <div class="info-pill hidden-sm">
        <span class="pill-label">下次刷新:</span>
        <span id="refresh-countdown" class="pill-value">05:00</span>
      </div>
      <div id="station-count-badge" class="badge-count">-- 站</div>
      <div id="map-engine-badge"></div>
    </div>

    <!-- Actions -->
    <div class="nav-actions">
      <button id="btn-refresh" class="btn-action" title="立即強制更新氣象資料">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
        </svg>
        <span>重新整理</span>
      </button>
      <button id="btn-settings" class="btn-icon" title="設定 API 金鑰">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Viewport: Map Background -->
  <main class="map-viewport">
    <div id="map-container" class="map-box"></div>

    <!-- HUD Control Panel (Top-Right) -->
    <aside class="hud-panel hud-controls">
      <div class="panel-section">
        <label class="section-label">Windy 天氣模型圖層</label>
        <div class="layer-buttons">
          <button class="layer-btn active" data-overlay="wind">
            <span class="btn-emoji">💨</span> 風場
          </button>
          <button class="layer-btn" data-overlay="rain">
            <span class="btn-emoji">🌧️</span> 降雨
          </button>
          <button class="layer-btn" data-overlay="clouds">
            <span class="btn-emoji">☁️</span> 雲層
          </button>
          <button class="layer-btn" data-overlay="temp">
            <span class="btn-emoji">🌡️</span> 氣溫
          </button>
        </div>
      </div>

      <div class="panel-section">
        <label class="section-label">觀測站篩選 & 搜尋</label>
        <div class="search-box">
          <input type="text" id="station-search" placeholder="搜尋測站名稱、代碼、地區..." autocomplete="off">
        </div>
        <div class="filter-row">
          <select id="county-filter" class="form-select">
            <option value="ALL">全臺灣縣市 (All)</option>
          </select>
        </div>
      </div>

      <div class="panel-section toggles-row">
        <label class="custom-toggle">
          <input type="checkbox" id="toggle-labels" checked>
          <span class="toggle-slider"></span>
          <span class="toggle-text">顯示測站溫度標籤</span>
        </label>
        <label class="custom-toggle">
          <input type="checkbox" id="toggle-particles" checked>
          <span class="toggle-slider"></span>
          <span class="toggle-text">風場粒子動態動畫</span>
        </label>
      </div>
    </aside>

    <!-- Side HUD: Top Extreme Stations (Hottest / Coldest) -->
    <aside class="hud-panel hud-rankings">
      <div class="rank-column">
        <div class="rank-header hot-header">
          <span class="rank-title-icon">🔥</span>
          <span class="rank-title">臺灣最高溫測站</span>
        </div>
        <div id="hottest-list" class="rank-list">
          <div class="rank-placeholder">載入中...</div>
        </div>
      </div>

      <div class="rank-divider"></div>

      <div class="rank-column">
        <div class="rank-header cold-header">
          <span class="rank-title-icon">❄️</span>
          <span class="rank-title">臺灣最低溫測站</span>
        </div>
        <div id="coldest-list" class="rank-list">
          <div class="rank-placeholder">載入中...</div>
        </div>
      </div>
    </aside>

    <!-- Bottom Left: Temperature Scale Legend -->
    <section class="hud-panel hud-legend">
      <div class="legend-header">
        <span class="legend-title">CWA 觀測氣溫級距圖例</span>
        <span id="data-source-badge" class="legend-source">CWA OpenData</span>
      </div>
      <div id="legend-items" class="legend-grid">
        <!-- Dynamically rendered -->
      </div>
    </section>
  </main>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">API 金鑰設定</h3>
        <button id="btn-close-settings" class="btn-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="input-windy-key" class="form-label">Windy Map Forecast API Key</label>
          <input type="text" id="input-windy-key" class="form-input" placeholder="請填入您的 Windy API Key (例: aBcD123...)">
          <p class="form-hint">
            若未填寫，系統將自動以高品質 Leaflet 暗黑地圖模式無縫呈現所有 CWA 測站即時溫度。
          </p>
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-save-settings" class="btn-primary">儲存並套用</button>
      </div>
    </div>
  </div>

  <!-- Main ES Module Script -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
